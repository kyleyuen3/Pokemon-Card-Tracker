name: Daily Pokemon card price update

on:
  schedule:
    # 06:17 UTC every day. Off-the-hour on purpose to avoid the top-of-hour
    # crowd on GitHub's scheduler.
    - cron: "17 6 * * *"
  workflow_dispatch: {}  # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-price-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: data-pipeline
        run: pip install -r requirements.txt

      - name: Fetch today's prices
        working-directory: data-pipeline
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: python3 fetch_prices.py

      - name: Rebuild dataset
        working-directory: data-pipeline
        run: python3 build_dataset.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-pipeline/history data-pipeline/all_sets_valuations.csv pokemon-valuations/public/cards_data.json
          if git diff --cached --quiet; then
            echo "No data changes today -- nothing to commit."
            exit 0
          fi
          git commit -m "Daily price update: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "Push attempt $i failed, retrying in $((i * 5))s..."
            sleep $((i * 5))
          done
